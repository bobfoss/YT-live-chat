[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-live-chat"
version = "0.4.1"
description = "Optional YT Library sidecar for YouTube live chat capture and replay"
requires-python = ">=3.11"

[project.entry-points."yt_library.plugins"]
live_chat = "yt_live_chat.plugin:create_plugin"

[tool.setuptools.packages.find]
include = ["yt_live_chat*"]

[tool.setuptools.package-data]
yt_live_chat = ["browser.css", "browser.js", "schema.sql"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
